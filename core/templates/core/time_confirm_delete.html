{% extends "base.html" %}

{% block title %}Excluir time | Futebol{% endblock %}

{% block content %}
<section class="confirm-card">
    <p class="eyebrow">Atenção</p>
    <h1>Excluir time?</h1>
    <p>Você está prestes a excluir <strong>{{ object.nome }}</strong>. Essa ação não pode ser desfeita.</p>
    <form method="post" class="form-actions">
        {% csrf_token %}
        <a class="button button-secondary" href="{% url 'time-list' %}">Cancelar</a>
        <button class="button button-danger" type="submit">Excluir</button>
    </form>
</section>
{% endblock %}
