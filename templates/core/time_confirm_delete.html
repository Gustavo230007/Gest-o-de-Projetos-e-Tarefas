{% extends "base.html" %}

{% block title %}Excluir time | Futebol{% endblock %}

{% block content %}
<section class="panel confirmation">
    <p class="eyebrow">Excluir cadastro</p>
    <h1>Excluir time?</h1>
    <p>Tem certeza que deseja excluir <strong>{{ time.nome }}</strong>?</p>
    <p class="muted">Essa ação não pode ser desfeita.</p>

    <form class="form-actions" method="post">
        {% csrf_token %}
        <a class="button button-light" href="{% url 'core:time_list' %}">Cancelar</a>
        <button class="button button-danger" type="submit">Excluir time</button>
    </form>
</section>
{% endblock %}
